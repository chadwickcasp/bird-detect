plugins {
    id 'com.android.application'
}

// Tensor G4 NPU smoke test: runs YOLO26n through LiteRT on CPU, then requests NPU-only execution.
// The runtime, the dispatch library, and the on-device compiler plugin are all from LiteRT 2.1.6.
android {
    namespace 'com.birddetect.g4smoke'
    compileSdk 35

    defaultConfig {
        applicationId "com.birddetect.g4smoke"
        minSdkVersion 31
        targetSdkVersion 35
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    androidResources {
        noCompress 'tflite'
    }

    packaging {
        jniLibs {
            // LiteRT looks for the dispatch library in nativeLibraryDir, so it must be extracted.
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'com.google.ai.edge.litert:litert:2.1.6'
}
